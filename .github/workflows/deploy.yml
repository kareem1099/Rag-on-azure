name: Deploy to server

on:
  push:
    branches:
      - DALEL-EL-SHAB-ELMOSLEM
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      REPO_DIR: /home/github_user/workspace/mini-rag
      BRANCH: DALEL-EL-SHAB-ELMOSLEM
    steps:
      - name: Pull latest code
        run: |
          cd "$REPO_DIR"
          git fetch origin
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git log --oneline -1

      - name: Rebuild and restart services
        run: |
          cd "$REPO_DIR/mini-rag-app/docker"
          docker compose up -d --build
          docker compose restart nginx prometheus grafana

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/v1/healthy; then
              echo
              echo "App is healthy"
              exit 0
            fi
            echo "Not ready yet, retrying in 5 seconds..."
            sleep 5
          done
          cd "$REPO_DIR/mini-rag-app/docker"
          docker compose logs --tail 50 fastapi
          exit 1

      - name: Clean old images
        run: docker image prune -f
